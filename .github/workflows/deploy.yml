name: Build and Deploy

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build and Push API
      run: |
        docker build -t mihidimi82/ads-api:latest ./api-ads
        docker push mihidimi82/ads-api:latest

    - name: Build and Push Client
      run: |
        docker build -t mihidimi82/ads-client:latest ./ads-client
        docker push mihidimi82/ads-client:latest

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        script: |
          echo "Current directory on EC2:"
          pwd
          echo "List files in current directory:"
          ls -lah
          cd dotnet-angular-ads-jwt
          docker compose pull
          docker compose up -d
